let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const box=new THREE.BoxGeometry(1,1,1);
const TX=(()=>{const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){let v=228+(rnd()-.5)*26;if(x==0||y==0)v=255;if(x==15||y==15)v=150;if(x==14||y==14)v=200;g.fillStyle=`rgb(${v|0},${v|0},${v|0})`;g.fillRect(x,y,1,1)}

  scene.add(new THREE.HemisphereLight('#e9f2d0','#2b2a22',.9));sun('#fff0c8',2.4,[12,22,8],12);

    const hd=cube(mat('#ffcf5a',{emissive:'#ff9a1f',emissiveIntensity:2.5}),x,.6,z,.26);scene.add(hd);const l=new THREE.PointLight('#ffb347',5,5);l.position.set(x,1,z);scene.add(l);return [hd,l]});
  const drops=['#c9c9c9','#4de2d6','#e8c34a','#d94a3a'].map((c,i)=>{const d=cube(mat(c,{emissive:c,emissiveIntensity:.25}),-3+i*2,.1,3.6,.38);scene.add(d);return d});

  [[.6,.35],[-.6,.35],[.6,-.35],[-.6,-.35]].forEach(([x,z])=>{const w=cube('#111',x,.2,z);w.scale.set(.4,.4,.2);car.add(w)});
  const hl=new THREE.SpotLight('#fff4d6',30,14,.5,.6);hl.position.set(1,.5,0);const tg=new THREE.Object3D();tg.position.set(6,0,0);car.add(hl,tg);hl.target=tg;
  const tl=cube(mat('#ff2a2a',{emissive:'#ff0000',emissiveIntensity:3}),-.96,.5,0);tl.scale.set(.04,.15,.8);car.add(tl);car.scale.setScalar(1.7);scene.add(car);
  // loop path: rectangle along road at z=4 / x=4
  const pts=[[-15,5],[15,5],[15,-5],[-15,-5]];
  update=t=>{const L=t*4,i=Math.floor(L)%4,f=L-Math.floor(L);const a=pts[i],b=pts[(i+1)%4];
    car.position.set(a[0]+(b[0]-a[0])*f,0,a[1]+(b[1]-a[1])*f);car.rotation.y=-Math.atan2(b[1]-a[1],b[0]-a[0]);
    const ang=Math.sin(t*Math.PI*2)*.25;cam.position.set(30*Math.cos(ang+.8),26,30*Math.sin(ang+.8));cam.lookAt(0,0,0)};
}
window.frame=t=>{update(t);R.render(scene,cam)};window.ready=true;
</script></body></html>
