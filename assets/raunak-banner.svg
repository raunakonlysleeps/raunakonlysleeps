<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Raunak — Code after hours</title>
  <desc id="desc">A dark developer console with mint and violet accents. Python, FiveM, web and automation.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1422"/><stop offset="1" stop-color="#19152e"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c4b5fd" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="22" fill="url(#grid)"/>
  <path d="M0 1H1200" stroke="#a3ffcb" stroke-width="3"/>
  <g font-family="'Courier New',monospace">
    <circle cx="53" cy="41" r="5" fill="#ff7b86"/><circle cx="73" cy="41" r="5" fill="#f5cc7a"/><circle cx="93" cy="41" r="5" fill="#a3ffcb"/>
    <text x="120" y="47" font-size="14" fill="#8e9cb4">raunak@workbench: ~</text>
    <text x="55" y="105" font-size="15" fill="#a3ffcb" letter-spacing="3">DEVELOPER / BUILDER / NIGHT OWL</text>
    <text x="48" y="201" font-size="94" font-weight="700" fill="#f3f5fc" letter-spacing="-5">RAUNAK<tspan fill="#a3ffcb">_</tspan></text>
    <text x="55" y="245" font-size="24" fill="#b5a0ff">Code after hours. Build beyond limits.</text>
    <text x="55" y="320" font-size="15" fill="#aab6cb">PYTHON  /  FIVEM  /  WEB  /  AUTOMATION</text>
    <g transform="translate(840 85)">
      <rect width="300" height="228" rx="14" fill="#0c1422" stroke="#38405a"/>
      <text x="24" y="42" fill="#8e9cb4" font-size="14">// always building</text>
      <text x="24" y="83" fill="#b5a0ff" font-size="19">while (curious) {</text>
      <text x="45" y="121" fill="#f3f5fc" font-size="19">learn();</text>
      <text x="45" y="155" fill="#a3ffcb" font-size="19">build();</text>
      <text x="24" y="193" fill="#b5a0ff" font-size="19">}</text>
    </g>
  </g>
</svg>
